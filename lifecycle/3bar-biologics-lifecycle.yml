generated: '2026-09-05'
method: probed
source: https://www.3barbiologics.com/wp-json/
description: >-
  3Bar Biologics publishes no versioning policy, no deprecation policy, no SLA, no changelog and no
  status page for the content API behind www.3barbiologics.com. Everything below is what could be
  observed on 2026-09-05; the absences are the finding, not a gap in harvesting.
versioning:
  scheme: uri-path namespace
  current: wp/v2
  namespaces_registered: 17
  docs: null
  detail: >-
    The version is a path namespace inherited from WordPress core and its plugins, not a contract
    3Bar Biologics maintains. It changes when the site is upgraded, on the site owner's schedule,
    with no announcement channel. The 17 namespaces at capture were oembed/1.0, leadin/v1,
    redirection/v1, yoast/v1, elementor-one/v1, elementor/v1, elementor-pro/v1, wp-smush/v1,
    hub-connector/v1, elementor-hello-elementor/v1, elementor/v1/documents, elementor-ai/v1,
    elementor/v1/feedback, wp/v2, wp-site-health/v1, wp-block-editor/v1 and wp-abilities/v1.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  detail: >-
    No RFC 8594 Sunset or Deprecation header was observed on any response, and no deprecation policy
    is published. A route can disappear when a plugin is deactivated — 13 of the 17 registered
    namespaces are plugin-provided (Elementor, Yoast, Redirection, HubSpot/leadin, Smush) and carry
    no stability commitment to third parties whatsoever. Only the wp/v2 and oembed/1.0 namespaces
    are core.
sla:
  url: null
  uptime_target: null
status_page:
  url: null
  detail: >-
    No status page exists. status.3barbiologics.com returns no A record, and no third-party status
    host is linked from the site. No StatusPage pointer is emitted in apis.yml, because there is no
    status page to point at.
changelog:
  url: null
  detail: >-
    No API changelog. The nearest dated public signal is the news archive at
    www.3barbiologics.com/news-insights/ (51 posts, most recent 2026-08-18) and its RSS feed at
    /feed/, which covers company news rather than API change. No ChangeLog pointer is emitted.
support:
  api_support_channel: null
  general_contact: https://www.3barbiologics.com/contact-us/
  detail: >-
    The published contact route is a sales address (Sales@3BarBiologics.com) and a phone number
    (1-877-3BAR-BIO). There is no developer or API support channel, no issue tracker and no
