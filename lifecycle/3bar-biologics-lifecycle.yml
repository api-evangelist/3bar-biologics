deprecated_operations: []
known_defects:
- id: media-order-asc-500
  surface: GET /wp/v2/media
  severity: high
  first_observed: '2026-09-05'
  summary: >-
    Ascending sort on a numeric or date field returns HTTP 500 with an HTML body. Reproduced across
    orderby=date, id and author, and via a bare order=asc. Posts and pages are unaffected.
  artifact: errors/3bar-biologics-problem-types.yml
- id: media-total-vs-returned
  surface: GET /wp/v2/media
  severity: high
  first_observed: '2026-09-05'
  summary: >-
    X-WP-Total advertises 560 attachments while anonymous pages return 0-5 records with HTTP 200.
    Fails silently; an empty 200 is indistinguishable from the end of the collection.
  artifact: errors/3bar-biologics-problem-types.yml
- id: careers-redirect-loop
  surface: https://www.3barbiologics.com/careers/
  severity: medium
  first_observed: '2026-09-05'
  summary: >-
    The Careers page exists in the Pages API (id 134) but its public URL is an infinite redirect
    loop: /careers/ 301s to /about-us/careers/, which 301s back to /careers/. curl aborts after 50
    hops. The page is readable through the API and unreachable in a browser. No Careers pointer is
    emitted in apis.yml as a result.
- id: apex-tls-mismatch
  surface: https://3barbiologics.com/
  severity: high
  first_observed: '2026-09-05'
  summary: >-
    The apex domain does not serve a valid certificate — see
    security/3bar-biologics-domain-security.yml.
stability_assessment:
  grade: unmanaged
  detail: >-
    Consume defensively. This is a marketing site's CMS API with no versioning commitment, no
    deprecation notice period, no status page, no changelog and no support channel, plus two
    reproducible defects on one of its nine documented surfaces. The 19 documented operations that
    sit in core wp/v2 and oembed/1.0 are the most stable; the yoast/v1 SEO endpoint is
    plugin-provided and will disappear if that plugin is replaced. Nothing here is offered to third
    parties as a product, and no commitment is made to anyone consuming it.
