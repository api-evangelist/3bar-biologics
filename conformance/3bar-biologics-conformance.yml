domain_standards:
  applicable: false
  detail: >-
    Agricultural biologicals and contract biomanufacturing do have domain data standards — AgGateway
    ADAPT for field-operations data, ISOBUS/ISO 11783 for machine data, and GS1 identifiers for
    product and logistics units are the ones a company in this market would plausibly speak. None of
    them appears anywhere in this contract, and none would be expected to: the surface captured here
    is a website content API, not a product, supply-chain or field-data interface. This is recorded
    as inapplicable rather than as a failure. The domain_standard_conformance check is reward-only,
    so no conformance is invented to fill the slot.
  candidates_checked:
  - {standard: AgGateway ADAPT, found: false}
  - {standard: ISO 11783 / ISOBUS, found: false}
  - {standard: GS1 GTIN / GLN, found: false}
  - {standard: OGC API / WMS / WFS, found: false, note: 'No geospatial surface; no evidence pointed at one, so no blind probing was performed.'}
compliance_program:
  published: false
  certifications: []
  detail: >-
    No SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP or CSA STAR claim appears anywhere on
    www.3barbiologics.com, no trust center is published, and trust.3barbiologics.com returns no A
    record (NOERROR/NODATA), so there is no trust host to reach. The company's public quality story is agricultural biomanufacturing capability rather
    than information-security certification, and no such claim is made. No Compliance pointer is
    emitted in apis.yml because there is no compliance program to point at.
