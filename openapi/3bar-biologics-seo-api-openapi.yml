info:
  title: 3Bar Biologics Metadata SEO API
  version: wp/v2
  description: Public Yoast SEO head endpoint returning the rendered head metadata and its parsed schema.org JSON-LD graph for any 3barbiologics.com URL — a structured-data view of every page that does not require parsing HTML. Running Yoast SEO v28.1 at capture.
  contact:
    name: 3Bar Biologics
    email: Sales@3BarBiologics.com
    url: https://www.3barbiologics.com/contact-us/
  x-generated-from: the server's own published route index (GET /wp-json/) and per-route JSON Schemas (HTTP OPTIONS), fetched 2026-09-05. No part of this document was authored from documentation or inference.
  x-provenance:
    method: derived
