generated: '2026-09-05'
method: probed
source: live 4xx/5xx responses from https://www.3barbiologics.com/wp-json/ + openapi/ derived responses
format: wp-rest-error
rfc9457: false
description: >-
  3Bar Biologics publishes no error reference. This catalog was built from error envelopes observed
  live against www.3barbiologics.com/wp-json on 2026-09-05, plus the 4xx responses declared in the
  nine derived OpenAPI documents in openapi/. The API does NOT use RFC 9457 problem+json; it uses
  the WordPress REST error envelope, served as application/json — except on the media collection,
  where a 500 escapes the envelope entirely and returns an HTML page.
envelope:
  content_type: application/json
  fields:
    code: Machine-readable error slug, e.g. rest_post_invalid_id. This is the stable identifier — match on it, not on `message`.
    message: Human-readable, localized message. Not stable; do not parse.
    data.status: The HTTP status code, repeated in the body.
    data.params: Present only on rest_invalid_param — a map of parameter name to validation message.
    data.details: Present only on rest_invalid_param — per-parameter code/message/data detail objects.
  example: '{"code":"rest_post_invalid_id","message":"Invalid post ID.","data":{"status":404}}'
problems:
- status: 400
  code: rest_invalid_param
  title: Invalid parameter(s)
  detail: >-
    One or more query parameters failed validation. data.params names each offending parameter and
    the constraint it violated.
  remediation: Read data.params for the exact bound. The most common cause is per_page outside 1..100.
  observed:
    url: https://www.3barbiologics.com/wp-json/wp/v2/posts?per_page=101
    http_status: 400
    body: '{"code":"rest_invalid_param","message":"Invalid parameter(s): per_page","data":{"status":400,"params":{"per_page":"per_page must be between 1 (inclusive) and 100 (inclusive)"}}}'
  applies_to: every list operation
- status: 400
  code: rest_post_invalid_page_number
  title: Page number out of range
  detail: The requested page number is larger than the number of pages available for the query.
  remediation: >-
    Read X-WP-TotalPages from the first response and stop there, or stop when the Link header no
    longer carries rel="next". Do not probe forward blindly.
  observed:
    url: https://www.3barbiologics.com/wp-json/wp/v2/posts?page=999
    http_status: 400
    body: '{"code":"rest_post_invalid_page_number","message":"The page number requested is larger than the number of pages available.","data":{"status":400}}'
  applies_to: listPosts, listPages, listMediaItems
- status: 400
  code: rest_orderby_include_missing_include
  title: orderby=include without include
  detail: >-
    `orderby=include` is declared in the enum for most collections but requires a companion
    `include` parameter naming the ids and their order.
  remediation: Pass `include=<id>,<id>` alongside `orderby=include`, or choose another sort field.
  observed:
    url: https://www.3barbiologics.com/wp-json/wp/v2/posts?orderby=include
    http_status: 400
    body: '{"code":"rest_orderby_include_missing_include","message":"You need to define an include parameter to order by include.","data":{"status":400}}'
  applies_to: every list operation that declares orderby=include
- status: 401
  code: rest_forbidden
  title: Not allowed
  detail: >-
    The operation requires authentication or a capability the anonymous caller does not have.
    Returned as 401 even where 403 would be more precise.
  remediation: >-
    This surface has no public credential path. Privileged reads and all writes require a WordPress
    application password issued to a site user; treat these operations as unavailable.
  observed:
    url: https://www.3barbiologics.com/wp-json/wp/v2/settings
    http_status: 401
    body: '{"code":"rest_forbidden","message":"Sorry, you are not allowed to do that.","data":{"status":401}}'
  applies_to: GET /wp/v2/settings, GET /wp/v2/elementor_library and every write method
- status: 401
  code: rest_cannot_view_plugins
  title: Cannot view plugins
  detail: Plugin inventory is a privileged read.
  remediation: Not available anonymously. Treat as unavailable.
  observed:
    url: https://www.3barbiologics.com/wp-json/wp/v2/plugins
    http_status: 401
    body: '{"code":"rest_cannot_view_plugins","message":"Sorry, you are not allowed to manage plugins for this site.","data":{"status":401}}'
  applies_to: GET /wp/v2/plugins
- status: 401
  code: rest_cannot_view_themes
  title: Cannot view themes
  detail: Theme inventory is a privileged read.
  remediation: Not available anonymously. Treat as unavailable.
  observed:
    url: https://www.3barbiologics.com/wp-json/wp/v2/themes
    http_status: 401
    body: '{"code":"rest_cannot_view_themes","message":"Sorry, you are not allowed to view themes.","data":{"status":401}}'
  applies_to: GET /wp/v2/themes
- status: 401
  code: rest_cannot_view
  title: Cannot view
  detail: Generic privileged-read denial; returned for menus.
  remediation: Not available anonymously. Treat as unavailable.
  observed:
    url: https://www.3barbiologics.com/wp-json/wp/v2/menus
    http_status: 401
    body: '{"code":"rest_cannot_view","message":"Sorry, you are not allowed to view menus.","data":{"status":401}}'
  applies_to: GET /wp/v2/menus
- status: 404
  code: rest_no_route
  title: No route matched
  detail: No route was found matching the URL and request method.
  remediation: >-
    Verify the path against the live route index at GET /wp-json/ (360 routes at capture). A route
    may exist for a different method than the one used.
  observed:
    url: https://www.3barbiologics.com/wp-json/wp/v2/nope
    http_status: 404
    body: '{"code":"rest_no_route","message":"No route was found matching the URL and request method.","data":{"status":404}}'
  applies_to: any unregistered path
- status: 404
  code: rest_post_invalid_id
  title: Invalid post ID
  detail: >-
    The numeric id in the path does not resolve to a readable object of the requested type. Also
    returned when the object exists but is not published, so a 404 does not prove non-existence.
  remediation: List the collection first and use an id from the response rather than guessing.
  observed:
    url: https://www.3barbiologics.com/wp-json/wp/v2/posts/99999999
    http_status: 404
    body: '{"code":"rest_post_invalid_id","message":"Invalid post ID.","data":{"status":404}}'
  applies_to: getPost, getPage, getMediaItem
  source_operations:
  - openapi/3bar-biologics-posts-api-openapi.yml#getPost
  - openapi/3bar-biologics-pages-api-openapi.yml#getPage
  - openapi/3bar-biologics-media-api-openapi.yml#getMediaItem
- status: 404
  code: rest_term_invalid
  title: Term does not exist
  detail: The numeric id in the path does not resolve to a term in the requested taxonomy.
  remediation: List the taxonomy first and use an id from the response.
  observed:
    url: https://www.3barbiologics.com/wp-json/wp/v2/categories/99999999
    http_status: 404
    body: '{"code":"rest_term_invalid","message":"Term does not exist.","data":{"status":404}}'
  applies_to: getCategory, getTag
  source_operations:
  - openapi/3bar-biologics-taxonomy-api-openapi.yml#getCategory
  - openapi/3bar-biologics-taxonomy-api-openapi.yml#getTag
- status: 404
  code: rest_user_invalid_id
  title: Invalid user ID
  detail: The numeric id in the path does not resolve to a public author record.
  remediation: List /wp/v2/users first and use an id from the response.
  observed:
    url: https://www.3barbiologics.com/wp-json/wp/v2/users/99999999
    http_status: 404
    body: '{"code":"rest_user_invalid_id","message":"Invalid user ID.","data":{"status":404}}'
  applies_to: getUser
  source_operations:
  - openapi/3bar-biologics-users-api-openapi.yml#getUser
- status: 404
  code: oembed_invalid_url
  title: Not an embeddable resource
  detail: The `url` parameter is not a resolvable resource on this site.
  remediation: Pass a URL on www.3barbiologics.com that resolves to a published post or page.
  observed:
    url: https://www.3barbiologics.com/wp-json/oembed/1.0/embed?url=https%3A%2F%2Fexample.com%2Fnope
    http_status: 404
    body: '{"code":"oembed_invalid_url","message":"Not Found","data":{"status":404}}'
  applies_to: getOembed
  source_operations:
  - openapi/3bar-biologics-oembed-api-openapi.yml#getOembed
- status: 500
  code: null
  title: Media collection ascending-sort failure
  detail: >-
    GET /wp/v2/media returns HTTP 500 whenever `order=asc` is combined with a numeric or date sort
    field (orderby=date, id or author; `date` is also the default, so a bare `order=asc` triggers
    it). The response is an HTML error page, NOT the WordPress JSON error envelope — there is no
    `code` to match on, which is why this entry has a null code. orderby=title and orderby=slug with
    order=asc succeed, and order=desc succeeds for every declared orderby value. The identical
    requests against /wp/v2/posts and /wp/v2/pages all return 200, so this is specific to the media
    collection on this deployment rather than WordPress core behaviour.
  remediation: >-
    Do not sort the media collection ascending on a numeric or date field. Page it with the default
    descending order, or sort ascending by `title` or `slug`. A client that parses the error body as
    JSON will also throw here — branch on the status code and the content-type, not on the body.
  observed:
    url: https://www.3barbiologics.com/wp-json/wp/v2/media?order=asc&per_page=3
    http_status: 500
    content_type: text/html
  reproduction:
  - {url: 'https://www.3barbiologics.com/wp-json/wp/v2/media?orderby=date&order=asc&per_page=3', http_status: 500}
  - {url: 'https://www.3barbiologics.com/wp-json/wp/v2/media?orderby=id&order=asc&per_page=3', http_status: 500}
  - {url: 'https://www.3barbiologics.com/wp-json/wp/v2/media?orderby=author&order=asc&per_page=3', http_status: 500}
  - {url: 'https://www.3barbiologics.com/wp-json/wp/v2/media?orderby=title&order=asc&per_page=3', http_status: 200}
  - {url: 'https://www.3barbiologics.com/wp-json/wp/v2/media?orderby=date&order=desc&per_page=3', http_status: 200}
  - {url: 'https://www.3barbiologics.com/wp-json/wp/v2/posts?order=asc&per_page=3', http_status: 200}
  applies_to: listMediaItems
  source_operations:
  - openapi/3bar-biologics-media-api-openapi.yml#listMediaItems
silent_failures:
- id: media-total-vs-returned
  status: 200
  title: Advertised media total does not match retrievable records
  detail: >-
    The media collection reports X-WP-Total 560 and X-WP-TotalPages 56, but anonymous pages return
    far fewer records than requested: per_page=1 and per_page=5 each returned 0 records with HTTP
    200, per_page=10 returned 2, and page=2 returned 5. The counter is computed before the
    per-record read filter is applied, so the advertised total counts attachments an anonymous
    caller cannot retrieve.
  remediation: >-
    Treat X-WP-Total on this collection as an upper bound, never as a completion target. Page until
    the Link header stops carrying rel="next" rather than until you have collected X-WP-Total
    records, and do not treat an empty 200 as the end of the collection.
  reproduction:
  - {url: 'https://www.3barbiologics.com/wp-json/wp/v2/media?per_page=1', http_status: 200, returned: 0, x_wp_total: 560}
  - {url: 'https://www.3barbiologics.com/wp-json/wp/v2/media?per_page=5', http_status: 200, returned: 0, x_wp_total: 560}
  - {url: 'https://www.3barbiologics.com/wp-json/wp/v2/media?per_page=10', http_status: 200, returned: 2, x_wp_total: 560}
  - {url: 'https://www.3barbiologics.com/wp-json/wp/v2/media?page=2', http_status: 200, returned: 5, x_wp_total: 560}
  why_it_matters: >-
    This is the most dangerous behaviour on the surface because it never signals failure. An empty
    200 is indistinguishable from the end of a collection, so a client that stops paging on the
    first empty page terminates immediately and silently concludes the media library is empty.
- id: yoast-404-with-body
  status: 404
  title: SEO head endpoint returns 404 with a populated body
  detail: >-
    GET /yoast/v1/get_head for a URL that does not resolve returns HTTP 404 but a well-formed body
    containing the rendered head of the site's 404 page (title "Page not found - 3BarBio"), not an
    error envelope.
  remediation: Branch on the HTTP status, not on body shape — the body parses successfully either way.
  reproduction:
  - {url: 'https://www.3barbiologics.com/wp-json/yoast/v1/get_head?url=https%3A%2F%2Fwww.3barbiologics.com%2Fnope%2F', http_status: 404}
  applies_to: getSeoHead
gaps:
- >-
  No published error reference exists. Every code here is the WordPress core set observed live or
  declared in the OPTIONS documents; a provider-authored catalog would be authoritative and this one
  is not.
- >-
  The API returns 401 where 403 is semantically correct for an authenticated-but-unauthorized
  caller. An agent should not treat 401 as "retry with credentials" on this surface, because there
  are no credentials to retry with.
- >-
  The media 500 is not expressible in the documented envelope at all. Any consumer that assumes
  every error on this API is application/json with a `code` field will crash rather than degrade.
