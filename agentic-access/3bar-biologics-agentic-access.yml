source: openapi/ + authentication/ + conventions/
description: >-
  Recommended x-agentic-access contracts for the 3Bar Biologics public content API, classified per
  operation. This is a RECOMMENDATION authored by API Evangelist, not a contract the provider
  publishes — 3Bar Biologics makes no statement about agent access at all. The classification is
  unusually simple here because the entire anonymously reachable surface is read-only.
posture:
  overall: safe-read-only
  detail: >-
    All 19 documented operations are GET. Every mutating route on the underlying WordPress install
    returns 401 without a WordPress application password, and that credential has no public issuance
    path, so no agent operating anonymously can change anything. An agent needs no consent gate, no
    spend cap, no escalation path and no reversal plan for this surface.
  robots_signal:
    x_robots_tag: noindex
    detail: >-
      Every API response carries `X-Robots-Tag: noindex`. This is an indexing directive rather than an
      access prohibition, and it is served on the API responses rather than in robots.txt, but it is
      the only signal the provider gives about machine consumption of this data. An agent should read
      freely and refrain from republishing the content as indexable material.
  robots_txt:
    url: https://www.3barbiologics.com/robots.txt
    http_status: 200
    detail: A Yoast-generated robots.txt is served. No /wp-json/ disallow was present.
default_contract:
  action_class: read
  consequence: none
  scope: public-content
  token: none
  escalation: not-required
  reversible: na
  rate_guidance: >-
    No published limits and no rate-limit response headers. Self-throttle. Responses are cached for 7
    days at the edge, so a cache-respecting agent generates almost no origin load.
