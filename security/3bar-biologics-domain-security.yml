generated: '2026-09-05'
method: probed
source: live DNS/TLS/HTTP probes of apis.yml + OpenAPI hosts
hosts:
- host: www.3barbiologics.com
  https: true
  tls_version: TLSv1.3
  cert_expires: Oct 21 15:20:23 2026 GMT
  hsts: true
  hsts_max_age: 300
  hsts_note: >-
    300 seconds is five minutes. The RFC 6797 preload threshold and common practice is 31536000 (one
    year); a five-minute max-age gives a returning visitor essentially no protection against an
    SSL-stripping downgrade, because the policy has almost always expired between visits. This is
    the Pantheon platform default for a site that has not enabled full HSTS.
- host: 3barbiologics.com
  https: false
  https_error: tls-certificate-name-mismatch
  hsts: null
  note: >-
    The apex domain is broken over HTTPS. It resolves to Pantheon (23.185.0.2) but the certificate
    presented is CN=pantheonsite.io, whose SANs are *.getpantheon.com, *.gotpantheon.com,
    *.pantheon.io, *.pantheonsite.io, getpantheon.com, gotpantheon.com and pantheonsite.io — none of
    which covers 3barbiologics.com. Every browser shows a certificate warning. Plain HTTP to the
    apex returns 404 rather than redirecting to www, so there is no working path from
    `3barbiologics.com` to the site by either scheme. A visitor who types the domain without `www.`
    does not reach 3Bar Biologics.
